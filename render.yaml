services:
  - type: web
    name: bel-workforce
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_HTTPS_ONLY
        value: "true"
