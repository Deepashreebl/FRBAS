<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BEL Workforce - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f1f5f9;

            color: #172033;
        }


        .login-card {

            width: 100%;

            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.10);
        }


        .header {

            text-align: center;

            margin-bottom: 30px;
        }


        .header h1 {

            margin: 0;

            color: #12479b;

            font-size: 31px;
        }


        .header p {

            margin-top: 8px;

            color: #667085;

            font-size: 14px;

            line-height: 1.5;
        }


        .login-title {

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 25px;

            color: #172033;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 16px;

            outline: none;
        }


        input:focus {

            border-color: #12479b;

            box-shadow:
                0 0 0 2px
                rgba(18, 71, 155, 0.10);
        }


        .password-container {

            position: relative;
        }


        .password-container input {

            padding-right: 70px;
        }


        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #12479b;

            font-weight: bold;

            cursor: pointer;
        }


        .options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            font-size: 14px;
        }


        .remember {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .remember input {

            width: auto;
        }


        .forgot {

            color: #12479b;

            cursor: pointer;

            text-decoration: none;

            font-weight: bold;
        }


        .signin-button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 9px;

            background: #12479b;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }


        .signin-button:hover {

            background: #0d3b82;
        }


        .signin-button:disabled {

            background: #94a3b8;

            cursor: not-allowed;
        }


        .message {

            display: none;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;
        }


        .success {

            display: block;

            background: #ecfdf3;

            color: #087443;

            border: 1px solid #a7f3d0;
        }


        .error {

            display: block;

            background: #fff1f2;

            color: #be123c;

            border: 1px solid #fecdd3;
        }


        .signup-link {

            text-align: center;

            margin-top: 25px;

            font-size: 16px;
        }


        .signup-link a {

            color: #5b21b6;

            font-weight: bold;

            text-decoration: none;
        }


        .signup-link a:hover {

            text-decoration: underline;
        }


        .footer {

            text-align: center;

            margin-top: 30px;

            color: #94a3b8;

            font-size: 13px;
        }


        .security-note {

            margin-top: 18px;

            padding: 10px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 8px;

            text-align: center;

            color: #64748b;

            font-size: 13px;
        }


        @media (max-width: 500px) {

            .login-card {

                margin: 15px;

                padding: 28px 22px;
            }
        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- HEADER -->

    <div class="header">

        <h1>BEL Workforce</h1>

        <p>
            Smart Employee Attendance & Payroll
            Management System
        </p>

    </div>


    <div class="login-title">
        Employee Login
    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMPLOYEE ID -->

        <div class="form-group">

            <label for="employeeId">
                Employee ID
            </label>

            <input
                type="text"
                id="employeeId"
                placeholder="Enter your Employee ID"
                autocomplete="username"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>


            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    class="show-password"
                    id="showPasswordButton"
                >
                    Show
                </button>

            </div>

        </div>


        <!-- OPTIONS -->

        <div class="options">

            <label class="remember">

                <input
                    type="checkbox"
                    id="rememberMe"
                >

                Remember me

            </label>


            <a
                href="#"
                class="forgot"
                id="forgotPassword"
            >
                Forgot Password?
            </a>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


        <!-- SIGN IN -->

        <button
            type="submit"
            class="signin-button"
            id="signinButton"
        >
            Sign In
        </button>


    </form>


    <!-- SIGN UP -->

    <div class="signup-link">

        Don't have an account?

        <a href="signup.html">
            Sign Up
        </a>

    </div>


    <div class="security-note">

        Password is case-sensitive.

    </div>


    <div class="footer">

        Secure access for authorized BEL Workforce users

    </div>


</div>


<script>


    // =====================================================
    // SHOW / HIDE PASSWORD
    // =====================================================

    const passwordField =
        document.getElementById("password");

    const showPasswordButton =
        document.getElementById("showPasswordButton");


    showPasswordButton.addEventListener(
        "click",
        function() {

            if (
                passwordField.type === "password"
            ) {

                passwordField.type = "text";

                showPasswordButton.textContent =
                    "Hide";

            } else {

                passwordField.type = "password";

                showPasswordButton.textContent =
                    "Show";
            }

        }
    );


    // =====================================================
    // MESSAGE
    // =====================================================

    function showMessage(
        message,
        type
    ) {

        const messageBox =
            document.getElementById("message");

        messageBox.textContent =
            message;

        messageBox.className =
            "message " + type;
    }


    // =====================================================
    // LOGIN
    // =====================================================

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const employeeId =
                    document
                        .getElementById("employeeId")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const rememberMe =
                    document
                        .getElementById("rememberMe")
                        .checked;


                // -----------------------------------------
                // VALIDATION
                // -----------------------------------------

                if (!employeeId) {

                    showMessage(
                        "Please enter your Employee ID.",
                        "error"
                    );

                    return;
                }


                if (!password) {

                    showMessage(
                        "Please enter your password.",
                        "error"
                    );

                    return;
                }


                const button =
                    document
                        .getElementById("signinButton");


                button.disabled = true;

                button.textContent =
                    "Signing In...";


                // -----------------------------------------
                // API REQUEST
                // -----------------------------------------

                try {

                    const response =
                        await fetch(
                            "http://127.0.0.1:8001/api/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    employee_id:
                                        employeeId,

                                    password:
                                        password

                                })
                            }
                        );


                    const result =
                        await response.json();


                    // -------------------------------------
                    // LOGIN FAILED
                    // -------------------------------------

                    if (!response.ok) {

                        showMessage(
                            result.detail ||
                            "Invalid Employee ID or password.",
                            "error"
                        );

                        button.disabled = false;

                        button.textContent =
                            "Sign In";

                        return;
                    }


                    // -------------------------------------
                    // LOGIN SUCCESS
                    // -------------------------------------

                    // Store logged-in employee information

                    sessionStorage.setItem(
                        "employeeId",
                        result.employee_id
                    );

                    sessionStorage.setItem(
                        "employeeName",
                        result.name
                    );

                    sessionStorage.setItem(
                        "employeeRole",
                        result.role
                    );


                    if (rememberMe) {

                        localStorage.setItem(
                            "belWorkforceEmployeeId",
                            result.employee_id
                        );

                    } else {

                        localStorage.removeItem(
                            "belWorkforceEmployeeId"
                        );

                    }


                    showMessage(
                        "Login successful! Opening your dashboard...",
                        "success"
                    );


                    // -------------------------------------
                    // DASHBOARD
                    // -------------------------------------

                    setTimeout(
                        function() {

                            if (
                                result.role === "admin" ||
                                result.role === "hr"
                            ) {

                                window.location.href =
                                    "admin/dashboard.html";

                            } else {

                                window.location.href =
                                    "employee/dashboard.html";

                            }

                        },
                        1000
                    );

                }


                catch (error) {

                    console.error(error);


                    showMessage(
                        "Cannot connect to the authentication server. Please make sure the API is running on port 8001.",
                        "error"
                    );


                    button.disabled = false;

                    button.textContent =
                        "Sign In";
                }

            }
        );


    // =====================================================
    // REMEMBER EMPLOYEE ID
    // =====================================================

    const savedEmployeeId =
        localStorage.getItem(
            "belWorkforceEmployeeId"
        );


    if (savedEmployeeId) {

        document
            .getElementById("employeeId")
            .value =
            savedEmployeeId;

        document
            .getElementById("rememberMe")
            .checked =
            true;
    }


    // =====================================================
    // FORGOT PASSWORD
    // =====================================================

    document
        .getElementById("forgotPassword")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                alert(
                    "Please contact BEL Workforce Admin / HR to reset your password."
                );

            }
        );

</script>


</body>

</html>
