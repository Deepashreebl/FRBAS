
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEL WORKFORCE - Face Scanner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: #f4f6f9;
    color: #202938;
    font-family: Arial, Helvetica, sans-serif;
}

.scanner-card {
    width: 100%;
    max-width: 520px;
    padding: 28px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.09);
    text-align: center;
}

h1 {
    margin: 0 0 8px;
    font-size: 26px;
    letter-spacing: .5px;
}

.subtitle {
    margin: 0 0 20px;
    color: #687386;
    font-size: 14px;
}

.mode-badge {
    display: inline-block;
    margin-bottom: 18px;
    padding: 8px 16px;
    border-radius: 20px;
    background: #e8f1ff;
    color: #1455a0;
    font-size: 13px;
    font-weight: bold;
}

.camera-container {
    position: relative;
    overflow: hidden;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #111827;
    border-radius: 12px;
}

/* Original camera design; no white face-guide overlay */
video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

.status {
    min-height: 54px;
    margin: 18px 0 12px;
    padding: 13px;
    border-radius: 9px;
    background: #f1f5f9;
    color: #334155;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.status.info {
    background: #eff6ff;
    color: #1d4ed8;
}

.status.success {
    background: #ecfdf5;
    color: #047857;
}

.status.error {
    background: #fef2f2;
    color: #b91c1c;
}

.status.warning {
    background: #fffbeb;
    color: #92400e;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .88;
}

button:disabled {
    cursor: not-allowed;
    opacity: .55;
}

.retry-btn {
    background: #2563eb;
    color: #fff;
}

.stop-btn {
    background: #e5e7eb;
    color: #374151;
}

.home-link {
    display: inline-block;
    margin-top: 22px;
    color: #2563eb;
    font-size: 14px;
    text-decoration: none;
}

.home-link:hover {
    text-decoration: underline;
}

.hint {
    margin: 14px 0 0;
    color: #7b8494;
    font-size: 12px;
    line-height: 1.5;
}

@media (max-width: 480px) {
    .scanner-card {
        padding: 20px;
    }

    h1 {
        font-size: 22px;
    }

    button {
        flex: 1;
    }
}
</style>
</head>

<body>
<main class="scanner-card">

    <h1>BEL WORKFORCE</h1>
    <p class="subtitle">Face Recognition Attendance System</p>

    <div class="mode-badge" id="modeBadge">
        INITIALIZING...
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="status" class="status info" role="status"
         aria-live="polite">
        Starting camera...
    </div>

    <div class="buttons">
        <button type="button" class="retry-btn" id="retryBtn">
            Retry Scanner
        </button>

        <button type="button" class="stop-btn" id="stopBtn">
            Stop Scanner
        </button>
    </div>

    <p class="hint">
        Allow camera access, keep your face visible, and follow the
        on-screen instruction to complete your attendance scan.
    </p>

    <a href="/" class="home-link">← Back to Home</a>

</main>

<script>
"use strict";

const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const modeBadge = document.getElementById("modeBadge");
const retryBtn = document.getElementById("retryBtn");
const stopBtn = document.getElementById("stopBtn");

const path = window.location.pathname.toLowerCase();

const mode =
    path.includes("check-out") || path.includes("checkout")
        ? "check-out"
        : "check-in";

modeBadge.textContent = mode === "check-in"
    ? "EMPLOYEE CHECK-IN"
    : "EMPLOYEE CHECK-OUT";

let stream = null;
let scannerTimer = null;
let cameraGeneration = 0;
let busy = false;
let finished = false;
let scanInProgress = false;
let lastScanTime = 0;
let welcomeSpoken = false;

const canvas = document.createElement("canvas");
const context = canvas.getContext("2d");

function setStatus(message, type = "info") {
    statusBox.textContent = message;
    statusBox.className = "status " + type;
}

/* Speak one message and wait until it finishes. */
function speak(message) {
    return new Promise(resolve => {
        if (!("speechSynthesis" in window) || !message) {
            resolve();
            return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "en-IN";
        utterance.rate = 0.88;
        utterance.pitch = 1;

        utterance.onend = () => resolve();
        utterance.onerror = () => resolve();

        window.speechSynthesis.speak(utterance);
    });
}

function employeeName(data) {
    return data.employee_name ||
        data.name ||
        (data.employee && data.employee.name) ||
        (data.employee && data.employee.full_name) ||
        "Employee";
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    video.srcObject = null;
}

function stopScanner(message = "Scanner stopped.") {
    cameraGeneration++;

    if (scannerTimer !== null) {
        clearInterval(scannerTimer);
        scannerTimer = null;
    }

    stopCamera();

    busy = false;
    scanInProgress = false;
    finished = true;

    retryBtn.disabled = false;
    stopBtn.disabled = true;

    setStatus(message, "warning");
}

function wait(milliseconds) {
    return new Promise(resolve => setTimeout(resolve, milliseconds));
}

async function readResponse(response) {
    const contentType = response.headers.get("content-type") || "";

    if (contentType.includes("application/json")) {
        return await response.json();
    }

    return {
        message: (await response.text()) ||
            `Request failed with HTTP ${response.status}.`
    };
}

function errorMessage(data) {
    if (typeof data.detail === "string") {
        return data.detail;
    }

    if (Array.isArray(data.detail)) {
        return data.detail.map(item =>
            `${Array.isArray(item.loc) ? item.loc.join(" → ") : "request"}: ${item.msg || "Invalid value"}`
        ).join("; ");
    }

    return data.message || data.error ||
        "Request failed. Please try again.";
}

async function capturePhoto() {
    if (!video.videoWidth || !video.videoHeight) {
        return null;
    }

    const maxWidth = 640;
    const scale = Math.min(1, maxWidth / video.videoWidth);

    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);

    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    return await new Promise(resolve => {
        canvas.toBlob(resolve, "image/jpeg", 0.85);
    });
}

async function sendAttendanceScan(photo, generation) {
    if (scanInProgress || !photo || finished) return;

    scanInProgress = true;

    try {
        const form = new FormData();

        // The backend endpoint expects mode and photo only.
        form.append("mode", mode);
        form.append("photo", photo, "attendance.jpg");

        setStatus(
            "Identifying employee. Please look at the camera...",
            "info"
        );

        const response = await fetch("/api/scan", {
            method: "POST",
            body: form,
            credentials: "same-origin"
        });

        if (generation !== cameraGeneration || finished) return;

        const data = await readResponse(response);

        if (!response.ok) {
            throw new Error(errorMessage(data));
        }

        const result = String(
            data.status || data.result || ""
        ).toLowerCase();

        const name = employeeName(data);

        const outcomes = {
            checked_in: {
                text: `${name}, your check-in has been registered.`,
                type: "success",
                stop: true
            },

            already_checked_in: {
                text: `${name}, you have already checked in.`,
                type: "warning",
                stop: true
            },

            checked_out: {
                text: `${name}, your check-out has been registered.`,
                type: "success",
                stop: true
            },

            not_checked_in: {
                text: `${name}, you have not checked in yet.`,
                type: "warning",
                stop: true
            },

            no_face: {
                text: "No face detected. Please look at the camera. Trying again shortly.",
                type: "warning",
                stop: false
            },

            multiple_faces: {
                text: "Multiple faces detected. Please make sure only one person is visible.",
                type: "warning",
                stop: false
            },

            unrecognized: {
                text: "Face not recognized yet. Please keep your face clearly visible. Trying again shortly.",
                type: "warning",
                stop: false
            },

            not_enrolled: {
                text: "Your face is not enrolled. Please contact the administrator.",
                type: "error",
                stop: true
            }
        };

        const outcome = outcomes[result];

        if (outcome) {
            setStatus(outcome.text, outcome.type);

            if (outcome.stop) {
                await speak(outcome.text);

                if (generation !== cameraGeneration || finished) return;

                stopScanner(outcome.text);
            } else {
                // Don't speak an error on every automatic retry.
                // Give the employee time to adjust their position.
                lastScanTime = Date.now();
            }

            return;
        }

        if (data.success === true) {
            const message = data.message ||
                `${name}, your attendance has been registered.`;

            setStatus(message, "success");
            await speak(message);

            if (generation === cameraGeneration && !finished) {
                stopScanner(message);
            }

            return;
        }

        const message = data.message ||
            "Unable to confirm attendance. Please keep your face visible and try again.";

        setStatus(message, "warning");
        lastScanTime = Date.now();

    } catch (error) {
        if (generation !== cameraGeneration || finished) return;

        console.error("Scanner error:", error);

        setStatus(
            error.message || "Unable to complete the scan. Please try again.",
            "error"
        );

        // Wait before trying again after a request error.
        lastScanTime = Date.now();

    } finally {
        scanInProgress = false;
    }
}

async function scanFrame(generation) {
    if (
        busy ||
        finished ||
        generation !== cameraGeneration ||
        !stream ||
        video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
    ) {
        return;
    }

    // Allow time between scan attempts.
    if (Date.now() - lastScanTime < 3000) return;

    busy = true;

    try {
        const photo = await capturePhoto();

        if (!photo || generation !== cameraGeneration || finished) {
            return;
        }

        await sendAttendanceScan(photo, generation);

    } catch (error) {
        if (generation !== cameraGeneration || finished) return;

        console.error("Scan frame error:", error);

        setStatus(
            error.message || "Unable to scan. Please retry.",
            "error"
        );

        lastScanTime = Date.now();

    } finally {
        busy = false;
    }
}

async function startScanner() {
    const generation = ++cameraGeneration;

    if (scannerTimer !== null) {
        clearInterval(scannerTimer);
        scannerTimer = null;
    }

    stopCamera();

    finished = false;
    busy = false;
    scanInProgress = false;
    lastScanTime = Date.now();

    retryBtn.disabled = true;
    stopBtn.disabled = false;

    setStatus("Requesting camera permission...", "info");

    try {
        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {
            throw new Error(
                "Camera access is unavailable. Open this page through localhost or HTTPS."
            );
        }

        stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: "user",
                width: { ideal: 640 },
                height: { ideal: 480 }
            }
        });

        if (generation !== cameraGeneration) {
            stream.getTracks().forEach(track => track.stop());
            return;
        }

        video.srcObject = stream;
        await video.play();

        if (generation !== cameraGeneration || finished) return;

        setStatus(
            "Camera ready. Please position yourself in front of the camera.",
            "info"
        );

        // Give the camera and employee time to settle.
        await wait(0);

        if (generation !== cameraGeneration || finished) return;

        // Welcome only once per page load; Retry Scanner won't greet again.
        if (!welcomeSpoken) {
            welcomeSpoken = true;

            await speak(
                "Welcome to BEL WORKFORCE. Please look at the camera naturally."
            );
        }

        if (generation !== cameraGeneration || finished) return;

        setStatus(
            "Please keep your face clearly visible. Identifying employee...",
            "info"
        );

        // Start scanning only after the welcome message has finished.
        lastScanTime = Date.now();

        scannerTimer = setInterval(
            () => scanFrame(generation),
            500
        );

        retryBtn.disabled = false;

    } catch (error) {
        if (generation !== cameraGeneration) return;

        console.error("Camera start error:", error);
        stopCamera();

        setStatus(
            error.message ||
            "Unable to start the camera. Check camera permission and retry.",
            "error"
        );

        await speak(
            "Unable to start the scanner. Please check camera permission."
        );

        retryBtn.disabled = false;
        stopBtn.disabled = true;
    }
}

retryBtn.addEventListener("click", () => {
    startScanner();
});

stopBtn.addEventListener("click", () => {
    stopScanner("Scanner stopped.");
});

window.addEventListener("beforeunload", () => {
    if (scannerTimer !== null) {
        clearInterval(scannerTimer);
    }

    stopCamera();

    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }
});

// Start the scanner once. No separate load greeting,
// so the welcome message will not play twice.
startScanner();
</script>
</body>
</html>
